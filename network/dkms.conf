# DKMS config for Realtek's out-of-tree r8152 driver (install.sh fills in the
# version). ARCH is set explicitly: an inherited ARCH=aarch64 breaks the build
# (the kernel's name for it is arm64).
PACKAGE_NAME="r8152"
PACKAGE_VERSION="@VERSION@"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ARCH=arm64 modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ARCH=arm64 clean"
BUILT_MODULE_NAME[0]="r8152"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
