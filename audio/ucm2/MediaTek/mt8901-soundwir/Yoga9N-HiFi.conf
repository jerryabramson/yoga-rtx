# Lenovo Yoga 9 2-in-1 16N1X11 (83N7): CS42L43 + 4x CS35L56, all on SoundWire
# link 1 (amp unique ids 0, 1, 4, 5).
#
# Based on NVIDIA's HiFi-cs42l43-cs35l56x4.conf (alsa-ucm-conf PR 862, head
# 7d3555a7, "not yet verified on this board"), with Yoga changes:
#  - the verb sets all four amps to 0 dB (400 = max = driver default). The
#    amps run untuned ROM firmware: there's no Lenovo 17aa:3802 tuning in
#    linux-firmware, and the machine driver doesn't pass the SSID.
#  - the verb's DisableSequence turns every output off.
# Playback only, by choice: the user records from a USB mic, and internal
# sources could take over as PipeWire's default. NVIDIA's capture path also
# works (checked by hand 2026-11-08): add their "Mic"/"Headset" devices and
# the PDI13/O020/O021 capture csets from PR 862 if ever needed.
# Verified 2026-11-08: speakers (L/R), headphones (jack switching, hardware volume).
#
# Paths:
#  speakers   DL0 (PCM 0) -> O152/O153 -> PDI3 -> DP3 -> 4x CS35L56
#  headphones DL1 (PCM 1) -> O156/O157 -> PDI5 -> DP5 -> CS42L43 HP

SectionVerb {
    EnableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
        # speakers
        cset "name='O152 I032 Switch' 1"
        cset "name='O153 I033 Switch' 1"
        cset "name='PDI3 Demux' DP3"
        cset "name='AMP1 Speaker Volume' 400"
        cset "name='AMP2 Speaker Volume' 400"
        cset "name='AMP3 Speaker Volume' 400"
        cset "name='AMP4 Speaker Volume' 400"
        # headphones
        cset "name='O156 I034 Switch' 1"
        cset "name='O157 I035 Switch' 1"
        cset "name='PDI5 Demux' DP5"
        cset "name='PDI6 Demux' DP6"
        cset "name='cs42l43 Headphone L Input 1' DP5RX1"
        cset "name='cs42l43 Headphone R Input 1' DP5RX2"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    EnableSequence [
        cset "name='Speaker Switch' 1"
        cset "name='AMP1 Speaker Switch' 1"
        cset "name='AMP2 Speaker Switch' 1"
        cset "name='AMP3 Speaker Switch' 1"
        cset "name='AMP4 Speaker Switch' 1"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "Headphone jack"
    EnableSequence [
        cset "name='Headphone Switch' 1"
        cset "name='cs42l43 Headphone Digital Volume' 229,229"
    ]
    DisableSequence [ cset "name='Headphone Switch' 0" ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
        PlaybackMixerElem "cs42l43 Headphone Digital"
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}
